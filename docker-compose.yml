services:
  db:
    image: postgres:16-alpine
    container_name: hoot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hoot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hoot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hoot_pgdata:
